<!doctype html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Formulario ejercicio_5</title>
  </head>
  <body>
    <h1><b>Formulario</b></h1>

    <form
      action="https://formtester.goodbytes.be/post.php"
      target="_blank"
      method="post"
    >
      <br />
      <label for="nombre_usuario">Nombre:</label>
      <input type="text" id="nombre_usuario" name="nombre" required />
      <br />
      <label for="apellidos_usuarios">Apellidos:</label>
      <input type="text" id="apellidos_usuarios" name="appellidos" required />
      <br />
      <label for="email_usuario">Email:</label>
      <input type="email" id="email_usuario" name="email" required />
      <br />
      <label for="contraseña_usuario">Contraseña:</label>
      <input type="password" id="contraseña_usuario" name="password" required />

      <br />
      <label for="fecha_de_nacimiento">Fecha de nacimiento:</label>
      <input type="date" id="fecha_de_nacimiento" name="fecha" required />

      <br />
      <label for="telefono_usuario">Teléfono:</label>
      <input type="tel" id="telefono_usuario" name="telefono" required />
      <br />

      Dirección:
      <br />
      <label for="text"></label>
      <textarea
        id="text"
        name="direccion"
        rows="8"
        cols="10"
        required
      ></textarea>

      <br />

      <button input type="submit" value="enviar Registrar por post" id="">
        Registrar
      </button>
    </form>
  </body>
</html>
