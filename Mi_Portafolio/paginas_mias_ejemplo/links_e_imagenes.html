<!DOCTYPE html>
<html>
  <head>
    <title>Imagenes y Enlaces</title>
  </head>
  <body>
    <div>
      <h1>Imagenes</h1>

      <h2>Imagen con url externa</h2>

      <!-- Para poner una imagen se usa la etiqueta <img> pero esta no tiene etiqueta de cierre-->

      <img
        src="https://cdn-fastly.motorcycle.com/media/2023/03/20/11047270/riding-the-ducati-panigale-v4r-a-mini-review.jpg?size=414x575&nocrop=1"
        alt="Imagen de moto Ducati panigale V4"
        width="330"
        height=""
      />

      <h2>Imagen con url de imagen local</h2>

      <img
        src="C:\Users\manue\Desktop\f1.jpg"
        alt="Piloto de la F1 celebrando"
        width="330"
        height=""
      />
    </div>

    <div>
      <h1>Enlaces o links</h1>

      <!-- Los links o vinculos se pueden crear con la etiqueta HTML <a> -->

      <a href="C:\Users\manue\Desktop\capacitacion HTML, CSS, JS\tablas.HTML" target="_blank"
        >Este es un link que mandara a mi ejecicio de Tablas html</a
      >

      <a href="https://www.facebook.com" target="_blank">

  </body>
</html>
