<!DOCTYPE html>
<html>
  <head>
    <title>Listas ordenadas y no ordenadas</title>
  </head>
  <body>
    <h2>Listas</h2>
    <h1>Listas sin usar listas html</h1>
    <p>1._Huevo</p>
    <p>2._Harina</p>
    <p>3._Leche</p>
    <!--ol es erden listo lista ordenada-->
    <h1>Lista ordenada o enumerada</h1>
    <ol>
      <!-- li es de list item o elemento de la lista -->
      <li>Huevo</li>
      <li>Harina</li>
      <li>Leche</li>
      <li>Huevo</li>
    </ol>
    <!-- ul es unordered list o lista desordenada -->
    <h3>Lista desordenada</h3>
    <ul>
      <!-- li es de list item o elemento de la lista -->
      <li>Huevo</li>
      <li>Harina</li>
      <li>Leche</li>
    </ul>
  </body>
</html>
