<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mi Página de Videos</title>
  </head>
  <body>
    <h1>Mi Página de Videos</h1>

    <h2>Video 1</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/wX7H4y9fcqM?si=B5ulOVJ5QO7ZaG8N"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <br />
    <h2>Video 2</h2>
    <iframe
      width="560"
      height="315"
      src="https://www.youtube.com/embed/zQ8caaUxIvY?si=yPn56zjz1kp59rwJ"
      title="YouTube video player"
      frameborder="0"
      allow="
        accelerometer;
        autoplay;
        clipboard-write;
        encrypted-media;
        gyroscope;
        picture-in-picture;
        web-share;
      "
      referrerpolicy="strict-origin-when-cross-origin"
      allowfullscreen
    ></iframe>
    <br />
    <h2>Página web embebida</h2>
    <iframe
      src="https://getbootstrap.com/"
      width="800"
      height="600"
      frameborder="0"
    >
    </iframe>
  </body>
</html>
