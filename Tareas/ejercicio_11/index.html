<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio con Bootstrap</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitcount+Grid+Double:wght@100..900&family=Black+Ops+One&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Mi Ejercicio con Bootstrap</h1>
      <div class="alert alert-info letra-puntos" role="alert">
        Este es un componente de alerta de Bootstrap.
      </div>
      <div class="button">
        <a
          href="https://getbootstrap.com"
          target="_blank"
          class="btn btn-primary"
          >Boton primario</a
        >
        <a
          href="https://getbootstrap.com"
          target="_blank"
          class="btn btn-secondary"
          >Boton secundario</a
        >
      </div>
      <div class="card" style="width: 18rem">
        <img
          src="./imagenes/imgejercicio11.jpg"
          class="card-img-top"
          alt="Imagen de ejemplo"
        />
        <div class="card-body letra-puntos">
          <h5 class="card-title">Card Title</h5>
          <p class="card-text">
            Este es un ejemplo de texto dentro de una tarjeta.
          </p>
          <a
            href="https://getbootstrap.com"
            target="_blank"
            class="btn btn-primary"
            >Ver más</a
          >
        </div>
      </div>
    </div>
  </body>
</html>
